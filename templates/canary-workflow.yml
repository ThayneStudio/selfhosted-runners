---
# Canary acceptance test for a freshly baked runner template.
#
# CANONICAL COPY. This file lives in ThayneStudio/selfhosted-runners as
# templates/canary-workflow.yml. The operator installs it into CANARY_REPO
# as .github/workflows/runner-canary.yml (the CANARY_WORKFLOW default) --
# see "Canary workflow" in that repo's README. Edit it here and reinstall;
# a copy edited only in CANARY_REPO drifts away from the bake it exists to
# validate.
#
# The canary gate clones canary-gen<GEN_ID> from a candidate generation,
# waits for it to register, then dispatches this workflow with
# generation=<GEN_ID>. Promotion is gated on this run concluding success,
# so every assertion below is a promotion gate: a failure blocks the
# template and pages an operator. That the job ran at all is itself the
# headline assertion -- a runner that registers, shows Online/Idle and is
# never assigned work is the exact failure this platform exists to catch,
# and no local smoke test sees it.
#
# LABEL TARGETING IS LOAD-BEARING. The canary registers with
# --no-default-labels and carries only gen-<GEN_ID>-canary, so runs-on
# names that label ALONE. GitHub assigns a queued job to any idle runner
# whose labels are a superset of runs-on, so adding self-hosted here would
# make the canary eligible for real production jobs: it would run one on an
# unvalidated image and then destroy itself (it is --ephemeral), leaving
# this dispatch with no runner and timing out a good generation.

name: Runner canary
run-name: Runner canary gen-${{ inputs.generation }}

# Quoted so yamllint does not read the key as the boolean `true`; GitHub
# treats "on" and on identically.
"on":
  workflow_dispatch:
    inputs:
      generation:
        description: >-
          Generation id under test. The job targets the label
          gen-<id>-canary, which only that generation's canary clone
          carries.
        required: true
        type: string

# Nothing here reads the repository -- there is deliberately no checkout,
# so the gate cannot be broken by an unrelated change in CANARY_REPO.
permissions:
  contents: read

defaults:
  run:
    # Naming bash explicitly gets -o pipefail on top of the implicit -e, so
    # an assertion that parses a version through a pipe fails on the tool
    # rather than only on the last stage of the pipe.
    shell: bash

env:
  # Each expectation mirrors a variable set at the top of
  # templates/template-setup.yaml. They are duplicated rather than derived:
  # this workflow runs in CANARY_REPO and cannot read the bake script.
  #
  # KEEPING THEM IN SYNC IS PART OF BUMPING A VERSION. A bake that raises
  # one of these must raise it here in the same change and reinstall this
  # file, or the next canary blocks a perfectly good image. Every version
  # assertion says exactly that in its failure message, because "wrong
  # version installed" and "we bumped it and forgot this file" look
  # identical in a job log.
  EXPECTED_PSQL_MAJOR: "17"               # POSTGRES_CLIENT_VERSION
  EXPECTED_SUPABASE_VERSION: "2.115.0"    # SUPABASE_VERSION
  EXPECTED_PLAYWRIGHT_VERSION: "1.62.1"   # PLAYWRIGHT_VERSION
  # PLAYWRIGHT_BROWSERS_PATH from the bake. Set explicitly so the assertion
  # is about the baked cache and not about whatever a default resolves to.
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
  # One image from the bake's warmed set (SUPABASE_PG_PROVE_IMAGE), pulled
  # to exercise the public.ecr.aws path -- through DOCKER_MIRROR_URL when
  # the template configured a mirror.
  CANARY_PROBE_IMAGE: public.ecr.aws/supabase/pg_prove:3.36

jobs:
  canary:
    name: canary gen-${{ inputs.generation }}
    # That label, alone. See the header before adding anything to this.
    runs-on: ["gen-${{ inputs.generation }}-canary"]
    # CANARY_TIMEOUT (default 1800s) covers dispatch through conclusion,
    # including Actions queue time. The assertions run in roughly three
    # minutes on a warm template -- supabase start dominates -- so this
    # ceiling fails the job loudly well inside that budget instead of
    # letting the poller time out, which is indistinguishable from a runner
    # that never picked the job up.
    timeout-minutes: 15
    steps:
      - name: Report canary identity and prepare assertions
        env:
          GENERATION: ${{ inputs.generation }}
        run: |
          echo "generation:  $GENERATION"
          echo "runner name: ${RUNNER_NAME:-unknown}"
          echo "hostname:    $(hostname)"
          echo "kernel:      $(uname -r)"
          echo "job user:    $(id -un)"
          # Reporting only: never fail the gate over a cosmetic line.
          awk -F= '/^PRETTY_NAME=/ { gsub(/"/, "", $2)
            print "os:          " $2 }' /etc/os-release || true

          expected_name="canary-gen${GENERATION}"
          if [[ "${RUNNER_NAME:-}" != "$expected_name" ]]; then
            # A notice, not a failure: an operator testing this workflow by
            # hand labels an ordinary runner, and that has to stay possible.
            # Still worth surfacing -- under the canary gate the job must
            # land on the clone named for the generation, and anything else
            # means the canary label leaked onto another runner.
            printf '::notice title=Canary runner name::%s\n' \
              "expected $expected_name, got ${RUNNER_NAME:-unknown}"
          fi

          # Assertion helpers. They live in a file because each run: step is
          # its own shell, and there is no other way to share a function.
          #
          # They emit ::error:: annotations rather than exiting bare: the
          # annotation is what GitHub puts in the run's check output, and the
          # check output is what an operator sees quoted in the
          # promotion-blocked notification. A bare exit 1 would tell them
          # only that a step named something failed.
          cat > "$RUNNER_TEMP/canary-assert.sh" <<'ASSERT'
          # Sourced by every assertion step below.

          DRIFT_HINT="If the bake changed this deliberately, update the"
          DRIFT_HINT="$DRIFT_HINT matching EXPECTED_* value in"
          DRIFT_HINT="$DRIFT_HINT templates/canary-workflow.yml"
          DRIFT_HINT="$DRIFT_HINT (ThayneStudio/selfhosted-runners) and"
          DRIFT_HINT="$DRIFT_HINT reinstall it into this repo."

          canary_row() {
            [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || return 0
            # Escape pipes so tool output cannot break the summary table.
            printf '| %s | %s | %s |\n' "$1" "$2" "${3//|/\\|}" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          # fail <check> <detail>... -- annotate, record, stop the job.
          fail() {
            local check="$1"
            shift
            printf '::error title=Canary: %s::%s\n' "$check" "$*"
            canary_row "$check" "FAILED" "$*"
            exit 1
          }

          # ok <check> <detail>...
          ok() {
            local check="$1"
            shift
            printf 'ok: %s -- %s\n' "$check" "$*"
            canary_row "$check" "ok" "$*"
          }
          ASSERT

          {
            echo "## Canary gen-${GENERATION} on ${RUNNER_NAME:-unknown}"
            echo ""
            echo "| Check | Result | Detail |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert baked toolchain is present
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          # The bake installs all of these and checks unzip and zstd by
          # name. A missing one here is an image every job would trip over,
          # so catch it before the slower version assertions.
          missing=""
          for tool in docker node npm npx gh git jq unzip zstd \
              psql pg_dump supabase aws; do
            command -v "$tool" > /dev/null 2>&1 || missing="$missing $tool"
          done
          [[ -z "$missing" ]] || fail "baked toolchain present" \
            "not on PATH for $(id -un):$missing"
          ok "baked toolchain present" \
            "node $(node --version), $(docker --version)"

      - name: Assert PostgreSQL client major version
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          # /usr/bin/psql is postgresql-common's pg_wrapper, which prints a
          # clusterless warning mentioning "pg_wrapper(1)" to stderr on a
          # client-only install -- an unanchored digit match reads that as
          # major 1. This is the anchored parse the bake uses.
          raw=$(psql --version 2>&1 || true)
          major=$(printf '%s\n' "$raw" \
            | grep -Eo 'psql \(PostgreSQL\) [0-9]+' \
            | head -1 | grep -Eo '[0-9]+$' || true)
          [[ "$major" == "$EXPECTED_PSQL_MAJOR" ]] || fail \
            "psql major version" \
            "expected major $EXPECTED_PSQL_MAJOR, got ${major:-none}." \
            "psql --version said: ${raw:-no output}." "$DRIFT_HINT"
          ok "psql major version" "$raw"

      - name: Assert Supabase CLI version
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          raw=$(supabase --version 2>&1 || true)
          got=$(printf '%s\n' "$raw" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1 || true)
          [[ "$got" == "$EXPECTED_SUPABASE_VERSION" ]] || fail \
            "supabase CLI version" \
            "expected $EXPECTED_SUPABASE_VERSION, got ${got:-none}." \
            "supabase --version said: ${raw:-no output}." "$DRIFT_HINT"
          ok "supabase CLI version" "$got"

      - name: Assert AWS CLI is v2
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          raw=$(aws --version 2>&1 || true)
          case "$raw" in
            aws-cli/2.*) ;;
            *) fail "AWS CLI major version" \
                 "expected aws-cli/2.x, got ${raw:-no output}." \
                 "v1 from pip or apt is not what the bake installs." ;;
          esac
          ok "AWS CLI major version" "$raw"

      - name: Assert Playwright CLI and prebaked Chromium
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          want="$EXPECTED_PLAYWRIGHT_VERSION"
          browsers="$PLAYWRIGHT_BROWSERS_PATH"

          # Pin the CLI by package version the way the bake does, rather
          # than trusting whatever a bare npx resolves to. This fetches the
          # npm package only -- browsers are never downloaded by --version.
          cli=$(npm exec --yes --package="playwright@${want}" -- \
            playwright --version 2>&1 || true)
          case "$cli" in
            *"$want"*) ;;
            *) fail "playwright CLI version" \
                 "expected $want, got ${cli:-no output}." "$DRIFT_HINT" ;;
          esac

          # Chromium has to come from the template's cache. A job that
          # quietly downloads its own pays ~150 MB every run and means the
          # bake's browser install never took.
          [[ -d "$browsers" ]] || fail "prebaked Chromium present" \
            "PLAYWRIGHT_BROWSERS_PATH $browsers does not exist."
          dir=$(find "$browsers" -maxdepth 1 -type d -name 'chromium-*' \
            | head -1 || true)
          [[ -n "$dir" ]] || fail "prebaked Chromium present" \
            "no chromium-* directory under $browsers; it holds:" \
            "$(find "$browsers" -maxdepth 1 -printf '%f ' || true)"

          # --dry-run resolves browsers exactly as a real install would but
          # downloads nothing, so a wrong revision is caught without paying
          # for the download that proves it.
          plan=$(npm exec --yes --package="playwright@${want}" -- \
            playwright install --dry-run chromium 2>&1 || true)
          locs=$(printf '%s\n' "$plan" | grep -i 'install location' || true)
          [[ -n "$locs" ]] || fail "Chromium resolves from prebaked cache" \
            "playwright install --dry-run named no install location." \
            "It printed: $(printf '%s' "$plan" | tr '\n' ' ')"
          # Herestring, not a pipe: fail must exit this shell, not a subshell.
          while read -r line; do
            path="${line##* }"
            case "$path" in
              "$browsers"/*) ;;
              *) fail "Chromium resolves from prebaked cache" \
                   "Playwright would use $path, outside $browsers." \
                   "The job would download its own browsers." ;;
            esac
            [[ -d "$path" ]] || fail \
              "Chromium resolves from prebaked cache" \
              "Playwright would install into $path, which does not exist," \
              "so this job would have downloaded Chromium."
          done <<< "$locs"

          # Executing it proves the --with-deps system libraries survived
          # the bake's cleanup, which a directory check alone does not.
          exe=$(find "$dir" -maxdepth 3 -type f \
            \( -name chrome -o -name headless_shell \) | head -1 || true)
          [[ -n "$exe" && -x "$exe" ]] || fail "prebaked Chromium runs" \
            "no executable chrome or headless_shell under $dir."
          ver=$("$exe" --version 2>&1 || true)
          case "$ver" in
            *Chrom*) ;;
            *) fail "prebaked Chromium runs" \
                 "$exe --version printed '${ver:-no output}'." \
                 "Missing system libraries are the usual cause." ;;
          esac
          ok "playwright CLI version" "$cli"
          ok "prebaked Chromium runs" "$ver from $dir"

      - name: Assert Supabase image pull resolves
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          docker info > /dev/null 2>&1 || fail "docker daemon reachable" \
            "docker info failed as $(id -un); check the docker group."

          # The mirror is transparent: containerd rewrites public.ecr.aws
          # per this hosts.toml, so a successful pull on a mirror-configured
          # template IS the evidence that the mirror resolves. Name it in
          # the log so a pull failure points at the right suspect.
          hosts=/etc/containerd/certs.d/public.ecr.aws/hosts.toml
          route="$CANARY_PROBE_IMAGE direct from public.ecr.aws"
          if [[ -f "$hosts" ]]; then
            mirror=$(grep -Eo 'host\."[^"]+"' "$hosts" | head -1 \
              | sed 's/.*"\(.*\)"/\1/' || true)
            route="$CANARY_PROBE_IMAGE via ${mirror:-unparsed $hosts}"
          fi
          echo "pulling $route"

          if ! out=$(docker pull "$CANARY_PROBE_IMAGE" 2>&1); then
            fail "Supabase image pull" "docker pull failed for $route:" \
              "$(printf '%s' "$out" | tr '\n' ' ')"
          fi
          ok "Supabase image pull" "$route"

      - name: Supabase start/stop round trip
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          work="$RUNNER_TEMP/canary-supabase"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work" || fail "supabase workspace" \
            "cannot enter $work; the runner temp directory is unusable."

          # supabase init prompts about editor settings; the bake feeds it
          # /dev/null for the same reason.
          if ! out=$(supabase init < /dev/null 2>&1); then
            fail "supabase init" \
              "$(printf '%s' "$out" | tr '\n' ' ')"
          fi

          # Stop even when a later assertion fails, so a failed canary does
          # not leave a stack running on a VM the gate may keep for triage.
          trap 'supabase stop --no-backup > /dev/null 2>&1 || true' EXIT

          # No image registry override here on purpose: when the template
          # has a mirror, register-runner.sh exports
          # SUPABASE_INTERNAL_IMAGE_REGISTRY into the runner process, so the
          # job inherits exactly what a real job would get.
          log="$RUNNER_TEMP/supabase-start.log"
          if ! supabase start 2>&1 | tee "$log"; then
            fail "supabase start" "supabase start failed; it last said:" \
              "$(tail -5 "$log" | tr '\n' ' ')"
          fi

          # The 17 client pin exists so psql and pg_dump can talk to
          # Supabase's Postgres. Assert that end to end: pg_dump hard-aborts
          # against a server newer than itself, which is the exact breakage
          # a stale client major causes and the version string alone hides.
          url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          server=$(psql -X -A -t "$url" -c 'show server_version' 2>&1) || \
            fail "psql reaches Supabase Postgres" \
              "psql could not query $url after supabase start:" \
              "$(printf '%s' "$server" | tr '\n' ' ')"
          dump=$(pg_dump --schema-only --file=/dev/null "$url" 2>&1) || fail \
            "pg_dump against Supabase Postgres" \
            "client major $EXPECTED_PSQL_MAJOR versus server $server:" \
            "$(printf '%s' "$dump" | tr '\n' ' ')"

          if ! stopped=$(supabase stop --no-backup 2>&1); then
            fail "supabase stop" \
              "$(printf '%s' "$stopped" | tr '\n' ' ')"
          fi
          trap - EXIT
          ok "supabase start/stop round trip" \
            "server_version $server, schema dump clean"

      - name: Canary verdict
        env:
          GENERATION: ${{ inputs.generation }}
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/canary-assert.sh"
          ok "canary verdict" \
            "generation $GENERATION accepted on ${RUNNER_NAME:-unknown}"
