#cloud-config

users:
  - name: runner
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: docker

write_files:
  - path: /opt/setup-template.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      # Logging with timestamps
      log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"; }
      log_error() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: $1" >&2; }

      export DEBIAN_FRONTEND=noninteractive
      export NEEDRESTART_MODE=a

      SUPABASE_VERSION=2.115.0
      SUPABASE_PG_PROVE_IMAGE=public.ecr.aws/supabase/pg_prove:3.36
      SUPABASE_SCHEMA_DIFF_IMAGE=public.ecr.aws/supabase/pgadmin-schema-diff:cli-0.0.5
      SUPABASE_MIGRA_IMAGE=public.ecr.aws/supabase/migra:3.0.1663481299
      DOCKER_MIRROR_URL="{{DOCKER_MIRROR_URL}}"
      SUPABASE_IMAGE_REGISTRY=""
      POSTGRES_CLIENT_VERSION=17
      PLAYWRIGHT_VERSION=1.62.1
      PLAYWRIGHT_BROWSERS_PATH=/home/runner/.cache/ms-playwright

      # Retry wrapper for network operations
      retry() {
        local max_attempts=3
        local delay=5
        local attempt=1
        local cmd="$@"

        while [[ $attempt -le $max_attempts ]]; do
          log "Attempt $attempt/$max_attempts: $cmd"
          if eval "$cmd"; then
            return 0
          fi
          log "Attempt $attempt failed, waiting ${delay}s..."
          sleep $delay
          ((attempt++))
          delay=$((delay * 2))
        done
        log_error "All $max_attempts attempts failed for: $cmd"
        return 1
      }

      log "=== Template Setup: Installing Tools ==="

      # Check disk space (need at least 5GB free)
      FREE_SPACE=$(df -BG /home | tail -1 | awk '{print $4}' | tr -d 'G')
      if [[ "$FREE_SPACE" -lt 5 ]]; then
        log_error "Insufficient disk space: ${FREE_SPACE}GB free, need at least 5GB"
        exit 1
      fi
      log "Disk space check passed: ${FREE_SPACE}GB free"

      log "[1/12] Checking network connectivity..."
      for i in {1..30}; do
        if curl -sf --max-time 5 https://github.com > /dev/null 2>&1; then
          log "Network connectivity confirmed"
          break
        fi
        if [[ $i -eq 30 ]]; then
          log_error "No network connectivity after 30 attempts"
          exit 1
        fi
        log "Waiting for network... ($i/30)"
        sleep 2
      done

      log "[2/12] Updating system packages and installing base prerequisites..."
      retry "apt-get update"
      retry "apt-get install -y ca-certificates curl gnupg jq unzip zstd build-essential git wget apt-transport-https software-properties-common qemu-guest-agent"
      systemctl enable --now qemu-guest-agent
      if ! systemctl is-active --quiet qemu-guest-agent; then
        log_error "qemu-guest-agent failed to start"
        exit 1
      fi
      retry "apt-get upgrade -y"
      log "Base packages installed and qemu-guest-agent running"

      log "[3/12] Installing Docker..."
      install -m 0755 -d /etc/apt/keyrings

      # Docker GPG key with retry
      retry "curl -fsSL --retry 3 --retry-delay 2 https://download.docker.com/linux/ubuntu/gpg -o /tmp/docker.gpg"
      gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg < /tmp/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      rm /tmp/docker.gpg

      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

      retry "apt-get update"
      retry "apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"

      # Verify Docker is running
      if ! systemctl is-active --quiet docker; then
        log "Starting Docker service..."
        systemctl start docker
        systemctl enable docker
      fi
      # Ensure runner user is in docker group (cloud-init may have created
      # the user before the docker group existed)
      usermod -aG docker runner
      log "Docker installed and running"

      if [[ -n "${DOCKER_MIRROR_URL:-}" ]]; then
        log "Configuring Docker mirror for public.ecr.aws: $DOCKER_MIRROR_URL"
        mkdir -p /etc/docker /etc/containerd/certs.d/public.ecr.aws
        SUPABASE_IMAGE_REGISTRY="${DOCKER_MIRROR_URL#http://}"
        SUPABASE_IMAGE_REGISTRY="${SUPABASE_IMAGE_REGISTRY#https://}"
        MIRROR_REGISTRY="${SUPABASE_IMAGE_REGISTRY%%/*}"
        mkdir -p "/etc/containerd/certs.d/$MIRROR_REGISTRY"
        if [[ "$DOCKER_MIRROR_URL" == http://* ]]; then
          cat > /etc/docker/daemon.json <<DOCKEREOF
      {
        "storage-driver": "overlay2",
        "insecure-registries": ["$MIRROR_REGISTRY"]
      }
      DOCKEREOF
        else
          cat > /etc/docker/daemon.json <<'DOCKEREOF'
      {
        "features": {
          "containerd-snapshotter": true
        }
      }
      DOCKEREOF
        fi
        cat > /etc/containerd/certs.d/public.ecr.aws/hosts.toml <<TOMLEOF
      server = "https://public.ecr.aws"

      [host."$DOCKER_MIRROR_URL"]
        capabilities = ["pull", "resolve"]
        skip_verify = true
      TOMLEOF
        cat > "/etc/containerd/certs.d/$MIRROR_REGISTRY/hosts.toml" <<TOMLEOF
      server = "$DOCKER_MIRROR_URL"

      [host."$DOCKER_MIRROR_URL"]
        capabilities = ["pull", "resolve"]
        skip_verify = true
      TOMLEOF
        systemctl restart docker
        log "Docker mirror configured for template bake"
        log "Supabase image registry override: $SUPABASE_IMAGE_REGISTRY"
      fi

      log "[4/12] Installing GitHub CLI..."
      retry "curl -fsSL --retry 3 --retry-delay 2 https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg"
      chmod a+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      retry "apt-get update"
      retry "apt-get install -y gh"
      log "GitHub CLI $(gh --version | head -1) installed"

      log "[5/12] Installing Node.js LTS..."
      retry "curl -fsSL --retry 3 https://deb.nodesource.com/setup_lts.x -o /tmp/nodesource_setup.sh"
      bash /tmp/nodesource_setup.sh
      rm /tmp/nodesource_setup.sh
      retry "apt-get install -y nodejs"
      log "Node.js $(node --version) installed"

      log "[6/12] Installing AWS CLI v2..."
      (
        set -euo pipefail
        AWS_TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$AWS_TMP_DIR"' EXIT

        retry "curl -fsSL --retry 3 --retry-delay 2 https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o '$AWS_TMP_DIR/awscliv2.zip'"
        unzip -q "$AWS_TMP_DIR/awscliv2.zip" -d "$AWS_TMP_DIR"
        "$AWS_TMP_DIR/aws/install" --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
      )
      AWS_VERSION=$(aws --version 2>&1 || true)
      if [[ "$AWS_VERSION" != aws-cli/2* ]]; then
        log_error "AWS CLI v2 install verification failed: ${AWS_VERSION:-missing output}"
        exit 1
      fi
      log "AWS CLI $AWS_VERSION installed"

      log "[7/12] Installing PostgreSQL client ${POSTGRES_CLIENT_VERSION}..."
      # Ubuntu 24.04 ships PostgreSQL 16 clients, but Supabase local development
      # defaults to Postgres 17. pg_dump/pg_restore refuse to talk to a server
      # newer than themselves, so take the matching client from PGDG instead.
      retry "curl -fsSL --retry 3 --retry-delay 2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc"
      gpg --batch --yes --dearmor -o /etc/apt/keyrings/pgdg.gpg < /tmp/pgdg.asc
      chmod a+r /etc/apt/keyrings/pgdg.gpg
      rm /tmp/pgdg.asc

      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | tee /etc/apt/sources.list.d/pgdg.list > /dev/null

      retry "apt-get update"
      retry "apt-get install -y postgresql-client-${POSTGRES_CLIENT_VERSION}"
      # Capture stdout+stderr once so a failure has something to report, then parse
      # anchored on the version line. /usr/bin/psql is postgresql-common's pg_wrapper,
      # which prints a clusterless warning containing "pg_wrapper(1)" to stderr on a
      # client-only install -- an unanchored digit match would read that as major 1.
      PSQL_VERSION_RAW=$(psql --version 2>&1 || true)
      PSQL_INSTALLED_MAJOR=$(printf '%s\n' "$PSQL_VERSION_RAW" | grep -Eo 'psql \(PostgreSQL\) [0-9]+' | head -1 | grep -Eo '[0-9]+$' || true)
      if [[ "$PSQL_INSTALLED_MAJOR" != "$POSTGRES_CLIENT_VERSION" ]]; then
        log_error "PostgreSQL client install verification failed: expected major ${POSTGRES_CLIENT_VERSION}"
        log_error "psql --version output: ${PSQL_VERSION_RAW:-missing output}"
        exit 1
      fi
      if ! command -v pg_dump > /dev/null 2>&1; then
        log_error "pg_dump not found on PATH after PostgreSQL client installation"
        exit 1
      fi
      log "PostgreSQL client major ${PSQL_INSTALLED_MAJOR} installed"

      log "[8/12] Installing Supabase CLI ${SUPABASE_VERSION}..."
      (
        set -euo pipefail
        SUPABASE_TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$SUPABASE_TMP_DIR"' EXIT

        SUPABASE_DEB="$SUPABASE_TMP_DIR/supabase_${SUPABASE_VERSION}_linux_amd64.deb"
        retry "curl -fsSL --retry 3 --retry-delay 2 https://github.com/supabase/cli/releases/download/v${SUPABASE_VERSION}/supabase_${SUPABASE_VERSION}_linux_amd64.deb -o '$SUPABASE_DEB'"
        apt-get install -y "$SUPABASE_DEB"
      )
      SUPABASE_INSTALLED_VERSION=$(supabase --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
      if [[ "$SUPABASE_INSTALLED_VERSION" != "$SUPABASE_VERSION" ]]; then
        log_error "Supabase CLI install verification failed: expected ${SUPABASE_VERSION}, got ${SUPABASE_INSTALLED_VERSION:-missing output}"
        exit 1
      fi
      log "Supabase CLI v${SUPABASE_INSTALLED_VERSION} installed"

      log "[9/12] Warming Supabase local development images..."
      (
        set -euo pipefail
        SUPABASE_WARMUP_DIR=$(mktemp -d)
        trap 'cd / && rm -rf "$SUPABASE_WARMUP_DIR"' EXIT

        cd "$SUPABASE_WARMUP_DIR"
        supabase init < /dev/null
        if [[ -n "${SUPABASE_IMAGE_REGISTRY:-}" ]]; then
          export SUPABASE_INTERNAL_IMAGE_REGISTRY="$SUPABASE_IMAGE_REGISTRY"
          export INTERNAL_IMAGE_REGISTRY="$SUPABASE_IMAGE_REGISTRY"
          SUPABASE_PG_PROVE_IMAGE="${SUPABASE_IMAGE_REGISTRY}/${SUPABASE_PG_PROVE_IMAGE#public.ecr.aws/}"
          SUPABASE_SCHEMA_DIFF_IMAGE="${SUPABASE_IMAGE_REGISTRY}/${SUPABASE_SCHEMA_DIFF_IMAGE#public.ecr.aws/}"
          SUPABASE_MIGRA_IMAGE="${SUPABASE_IMAGE_REGISTRY}/${SUPABASE_MIGRA_IMAGE#public.ecr.aws/}"
        fi
        retry "supabase start"
        supabase stop --no-backup
        retry "docker pull ${SUPABASE_PG_PROVE_IMAGE}"
        retry "docker pull ${SUPABASE_SCHEMA_DIFF_IMAGE}"
        retry "docker pull ${SUPABASE_MIGRA_IMAGE}"
      )
      log "Supabase local development and database job Docker cache warmed"

      log "[10/12] Installing Playwright Chromium..."
      install -d -o runner -g runner -m 0755 /home/runner/.cache "$PLAYWRIGHT_BROWSERS_PATH"
      retry "env PLAYWRIGHT_BROWSERS_PATH='$PLAYWRIGHT_BROWSERS_PATH' npm exec --yes --package=playwright@${PLAYWRIGHT_VERSION} -- playwright install --with-deps chromium"
      PLAYWRIGHT_CLI_VERSION=$(env PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" npm exec --yes --package=playwright@"${PLAYWRIGHT_VERSION}" -- playwright --version 2>&1 || true)
      if [[ "$PLAYWRIGHT_CLI_VERSION" != *"${PLAYWRIGHT_VERSION}"* ]]; then
        log_error "Playwright CLI version verification failed: expected ${PLAYWRIGHT_VERSION}, got ${PLAYWRIGHT_CLI_VERSION:-missing output}"
        exit 1
      fi
      if [[ ! -d "$PLAYWRIGHT_BROWSERS_PATH" ]] || ! find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 1 -type d -name 'chromium-*' | grep -q .; then
        log_error "Playwright Chromium install verification failed: no Chromium browser directory found in $PLAYWRIGHT_BROWSERS_PATH"
        exit 1
      fi
      chown -R runner:runner /home/runner/.cache
      log "Playwright Chromium ${PLAYWRIGHT_VERSION} installed in $PLAYWRIGHT_BROWSERS_PATH"

      if ! command -v unzip > /dev/null 2>&1; then
        log_error "unzip not found on PATH after package installation"
        exit 1
      fi
      if ! command -v zstd > /dev/null 2>&1; then
        log_error "zstd not found on PATH after package installation"
        exit 1
      fi

      log "[11/12] Downloading GitHub Actions runner..."
      RUNNER_HOME=/home/runner/actions-runner
      RUNNER_USER=runner
      mkdir -p $RUNNER_HOME
      chown $RUNNER_USER:$RUNNER_USER $RUNNER_HOME
      cd $RUNNER_HOME

      # Get latest runner version with validation
      RUNNER_VERSION=$(curl -sf --retry 3 https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name | sed 's/v//')
      if [[ -z "$RUNNER_VERSION" || "$RUNNER_VERSION" == "null" ]]; then
        log_error "Failed to get runner version from GitHub API"
        exit 1
      fi
      log "Latest runner version: $RUNNER_VERSION"

      RUNNER_URL="https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
      retry "curl -fsSL --retry 3 -o actions-runner.tar.gz '$RUNNER_URL'"

      # Verify download
      if [[ ! -s actions-runner.tar.gz ]]; then
        log_error "Runner download is empty or missing"
        exit 1
      fi

      tar xzf actions-runner.tar.gz || {
        log_error "Failed to extract runner archive"
        exit 1
      }
      rm actions-runner.tar.gz
      chown -R $RUNNER_USER:$RUNNER_USER $RUNNER_HOME

      # Install runner .NET/ICU runtime dependencies
      ./bin/installdependencies.sh || {
        log_error "Failed to install runner dependencies"
        exit 1
      }
      log "Runner extracted and dependencies installed"

      log "[12/12] Cleaning up for template conversion..."
      apt-get clean
      rm -rf /tmp/* /var/tmp/*
      truncate -s 0 /var/log/*.log 2>/dev/null || true

      log "=== Template setup complete! ==="
      log "Installed: Docker, GitHub CLI, Node.js, zstd, unzip, AWS CLI v2, PostgreSQL client ${POSTGRES_CLIENT_VERSION}, Supabase CLI ${SUPABASE_VERSION} with warmed local and database job Docker cache, Playwright Chromium ${PLAYWRIGHT_VERSION}, Actions runner"

      # Reset instance identity so clones get a fresh machine-id and SSH host keys.
      cloud-init clean --logs
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id
      rm -f /etc/ssh/ssh_host_*

      # Completion marker, written LAST. The guest deliberately does NOT power
      # itself off: a self-poweroff is indistinguishable from a crash or an
      # operator `qm stop`, which is how a half-baked template used to get
      # published. The host waits for this marker, confirms it over the guest
      # agent while the VM is still up, then shuts the VM down itself.
      printf '%s\n' "$RUNNER_VERSION" > /opt/.runner-version
      touch /opt/.template-setup-complete

runcmd:
  - /opt/setup-template.sh 2>&1 | tee /var/log/template-setup.log
