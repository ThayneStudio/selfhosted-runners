#cloud-config

write_files:
  # Force DHCP to use MAC address instead of machine-id derived DUID.
  # Prevents clones from getting the same IP even if machine-id regeneration fails.
  - path: /etc/netplan/99-dhcp-mac.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac

  - path: /etc/github-runner/config.env
    permissions: '0600'
    content: |
      GITHUB_PAT="{{GITHUB_PAT}}"
      GITHUB_ORG="{{GITHUB_ORG}}"
      RUNNER_LABELS="self-hosted,linux,x64"
      DOCKER_MIRROR_URL="{{DOCKER_MIRROR_URL}}"

  - path: /opt/register-runner.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      # Logging with timestamps
      log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"; }
      log_error() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: $1" >&2; }

      # Always shut down the VM when this script exits (success or failure).
      # Prevents zombie VMs that block a runner slot forever.
      # EXIT fires on any exit — ERR does NOT fire for handled errors (|| blocks).
      trap 'log "Shutting down VM..."; shutdown -h now' EXIT

      log "=== GitHub Actions Runner Registration ==="

      # Validate environment
      if [[ ! -f /etc/github-runner/config.env ]]; then
        log_error "Config file not found: /etc/github-runner/config.env"
        exit 1
      fi

      source /etc/github-runner/config.env

      # Override labels if vendor-data provided a labels.env
      if [[ -f /etc/github-runner/labels.env ]]; then
        source /etc/github-runner/labels.env
      fi

      # Validate required variables
      : ${GITHUB_PAT:?GITHUB_PAT not set}
      : ${GITHUB_ORG:?GITHUB_ORG not set}
      : ${RUNNER_LABELS:=self-hosted,linux,x64}

      # Configure Docker mirror if set. Transparent pull-through cache
      # for public.ecr.aws via containerd's per-registry host config.
      # Non-fatal: a failed mirror restart falls back to direct pulls.
      if [[ -n "${DOCKER_MIRROR_URL:-}" ]]; then
        log "Configuring Docker mirror for public.ecr.aws: $DOCKER_MIRROR_URL"
        mkdir -p /etc/docker /etc/containerd/certs.d/public.ecr.aws
        SUPABASE_IMAGE_REGISTRY="${DOCKER_MIRROR_URL#http://}"
        SUPABASE_IMAGE_REGISTRY="${SUPABASE_IMAGE_REGISTRY#https://}"
        MIRROR_REGISTRY="${SUPABASE_IMAGE_REGISTRY%%/*}"
        mkdir -p "/etc/containerd/certs.d/$MIRROR_REGISTRY"
        if [[ "$DOCKER_MIRROR_URL" == http://* ]]; then
          cat > /etc/docker/daemon.json <<DOCKEREOF
      {
        "storage-driver": "overlay2",
        "insecure-registries": ["$MIRROR_REGISTRY"]
      }
      DOCKEREOF
        else
          cat > /etc/docker/daemon.json <<'DOCKEREOF'
      {
        "features": {
          "containerd-snapshotter": true
        }
      }
      DOCKEREOF
        fi
        cat > /etc/containerd/certs.d/public.ecr.aws/hosts.toml <<TOMLEOF
      server = "https://public.ecr.aws"

      [host."$DOCKER_MIRROR_URL"]
        capabilities = ["pull", "resolve"]
        skip_verify = true
      TOMLEOF
        cat > "/etc/containerd/certs.d/$MIRROR_REGISTRY/hosts.toml" <<TOMLEOF
      server = "$DOCKER_MIRROR_URL"

      [host."$DOCKER_MIRROR_URL"]
        capabilities = ["pull", "resolve"]
        skip_verify = true
      TOMLEOF
        if systemctl restart docker; then
          log "Docker mirror configured"
          log "Supabase image registry override: $SUPABASE_IMAGE_REGISTRY"
        else
          log_error "Docker restart failed after mirror config; refusing to register runner"
          exit 1
        fi
      fi

      if ! systemctl is-active --quiet docker; then
        log_error "Docker is not running; refusing to register runner"
        exit 1
      fi

      RUNNER_HOME=/home/runner/actions-runner
      RUNNER_USER=runner

      # Verify runner binary exists (should be baked into template)
      if [[ ! -f "$RUNNER_HOME/config.sh" ]]; then
        log_error "Runner binary not found at $RUNNER_HOME/config.sh"
        log_error "The VM template may not have been baked correctly. Run 'runner upgrade'."
        exit 1
      fi

      cd $RUNNER_HOME

      # Remove DHCP-provided DNS (often unreachable from VMs on bridged networks)
      # and keep only the explicitly configured nameservers from Proxmox cloud-init.
      CONFIGURED_DNS=$(resolvectl status eth0 2>/dev/null | grep "DNS Servers:" | sed 's/.*DNS Servers: //')
      # Filter out the DHCP gateway IP (first hop, often not a DNS server for VMs)
      GATEWAY=$(ip route | awk '/default/{print $3}')
      CLEAN_DNS=$(echo "$CONFIGURED_DNS" | tr ' ' '\n' | grep -vxF "$GATEWAY" | tr '\n' ' ')
      if [[ -n "$CLEAN_DNS" ]]; then
        resolvectl dns eth0 $CLEAN_DNS 2>/dev/null || true
      fi

      # Wait for network connectivity
      log "[1/3] Checking network connectivity..."
      for i in {1..30}; do
        if curl -sf --max-time 5 https://github.com > /dev/null 2>&1; then
          log "Network connectivity confirmed"
          break
        fi
        if [[ $i -eq 30 ]]; then
          log_error "No network connectivity after 30 attempts"
          exit 1
        fi
        log "Waiting for network... ($i/30)"
        sleep 2
      done

      log "[2/3] Registering runner with GitHub..."
      # Get registration token with error details
      # Pass auth header via file descriptor to avoid leaking PAT in /proc/PID/cmdline
      REG_RESPONSE=$(curl -sf --retry 3 -X POST \
        -H "Accept: application/vnd.github.v3+json" \
        --config <(printf 'header = "Authorization: token %s"\n' "$GITHUB_PAT") \
        "https://api.github.com/orgs/${GITHUB_ORG}/actions/runners/registration-token" 2>&1) || {
        log_error "Failed to get registration token from GitHub API"
        log_error "Response: $REG_RESPONSE"
        exit 1
      }

      REG_TOKEN=$(echo "$REG_RESPONSE" | jq -r .token)
      if [[ "$REG_TOKEN" == "null" || -z "$REG_TOKEN" ]]; then
        log_error "Invalid registration token received"
        log_error "Response: $REG_RESPONSE"
        log_error "Check that your PAT has 'admin:org' scope"
        exit 1
      fi

      # Configure runner as ephemeral (retry on timeout — simultaneous VMs can overload the API)
      #
      # --disableupdate: these VMs are ephemeral clones of a baked template, so a
      # runner self-update would re-download the ~225MB runner package on EVERY
      # job boot until the template is rebaked.
      #
      # The trade-off: the template MUST be rebaked within 30 days of a new runner
      # release (sooner for critical security updates) or GitHub stops queuing jobs
      # to these runners. Registration still SUCCEEDS -- runners appear Online/Idle
      # while jobs queue forever, which reads like a GitHub outage rather than a
      # stale template. Keep the rebake schedule healthy.
      #
      # --no-default-labels when labels.env sets RUNNER_NO_DEFAULT_LABELS: config.sh
      # otherwise adds self-hosted/Linux/X64, which would make a canary eligible
      # for production jobs. Proven by "register-runner.sh passes --no-default-labels
      # when RUNNER_NO_DEFAULT_LABELS=true".
      extra=""
      if [[ "${RUNNER_NO_DEFAULT_LABELS:-}" == "true" ]]; then
        extra="--no-default-labels"
      fi
      for attempt in 1 2 3; do
        if sudo -u $RUNNER_USER ./config.sh \
          --url "https://github.com/${GITHUB_ORG}" \
          --token "$REG_TOKEN" \
          --name "$(hostname)" \
          --labels "$RUNNER_LABELS" \
          --unattended \
          --replace \
          --disableupdate \
          --ephemeral \
          ${extra:+"$extra"}; then
          break
        fi
        if [[ $attempt -eq 3 ]]; then
          log_error "Runner configuration failed after 3 attempts"
          exit 1
        fi
        log "Config attempt $attempt failed, retrying in 10s..."
        sleep 10
      done
      log "Runner configured successfully (ephemeral mode)"

      # Signal that the runner is ready
      touch /opt/.runner-ready

      log "[3/3] Starting runner (ephemeral — will shut down after one job)..."
      log "Runner name: $(hostname)"
      log "Labels: $RUNNER_LABELS"
      log "Organization: $GITHUB_ORG"

      # Run directly (not as systemd service). When the runner exits
      # (job complete or error), the VM shuts down immediately.
      # The Proxmox hookscript then destroys and reclones.
      if [[ -n "${SUPABASE_IMAGE_REGISTRY:-}" ]]; then
        sudo -u $RUNNER_USER env SUPABASE_INTERNAL_IMAGE_REGISTRY="$SUPABASE_IMAGE_REGISTRY" INTERNAL_IMAGE_REGISTRY="$SUPABASE_IMAGE_REGISTRY" ./run.sh || true
      else
        sudo -u $RUNNER_USER ./run.sh || true
      fi
      # EXIT trap handles shutdown

bootcmd:
  # Hard ceiling: power the VM off 6 hours after boot even if run.sh hangs.
  #
  # This lives in bootcmd, not runcmd, because runcmd is per-instance and the
  # instance-id is pinned host-side at clone time — a guest reboot presents the
  # same instance-id, so runcmd never re-runs and the ceiling would be lost for
  # the rest of the VM's life. bootcmd runs on every boot.
  #
  # It is a systemd timer, not `shutdown -h +360`, because `shutdown` schedules
  # through logind over D-Bus and bootcmd runs in cloud-init's init stage, where
  # dbus/logind may not be up yet — that failure is silent and buys nothing.
  # `systemctl` as root reaches PID 1 over /run/systemd/private, no bus needed.
  #
  # OnBootSec= is what re-arms after a reboot, because the enable symlink is on
  # the VM's disk. Which path arms it on the second boot is NOT ordered:
  # cloud-init.service sets DefaultDependencies=no and carries no ordering
  # against timers.target, so either timers.target or this bootcmd may win.
  # It does not matter — both paths are idempotent, verified by running the
  # rendered bootcmd twice against a fake root and diffing the result.
  - |
    cat > /etc/systemd/system/github-runner-lifetime.service <<'CEILINGEOF'
    [Unit]
    Description=Power off the runner VM at its maximum lifetime

    [Service]
    Type=oneshot
    # Leading "-": oneshot stops at the first ExecStart that fails and marks the
    # unit failed, so a sick logger (journald socket gone, util-linux removed by
    # a job) must not be allowed to swallow the poweroff below.
    ExecStart=-/usr/bin/logger -t github-runner "Safety timeout: max VM lifetime reached"
    # --no-block: the poweroff job stops this unit, so waiting on it deadlocks.
    ExecStart=/usr/bin/systemctl --no-block poweroff
    CEILINGEOF
    cat > /etc/systemd/system/github-runner-lifetime.timer <<'CEILINGEOF'
    [Unit]
    Description=6-hour ceiling on runner VM lifetime

    [Timer]
    OnBootSec=6h

    [Install]
    WantedBy=timers.target
    CEILINGEOF
    systemctl daemon-reload
    # enable is the durable half — if the symlink is not written the ceiling is
    # gone for this VM's life, so let a failure there fail the module loudly.
    systemctl enable github-runner-lifetime.timer || exit 1
    # start is the this-boot half, and --no-block because a timer implicitly
    # gains After=sysinit.target while cloud-init.service is not ordered after
    # it: a blocking start can wait, and its rc would fail cc_bootcmd for
    # nothing. timers.target arms the timer on any boot where this loses.
    systemctl start --no-block github-runner-lifetime.timer || true

runcmd:
  - /opt/register-runner.sh 2>&1 | tee /var/log/runner-setup.log
