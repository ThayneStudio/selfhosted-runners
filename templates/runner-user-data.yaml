#cloud-config

write_files:
  # The DHCP client identifier is baked into the template
  # (/etc/netplan/99-dhcp-mac.yaml): write_files runs after networkd has
  # started DHCP, and nothing applies netplan again on a clone.
  - path: /etc/github-runner/config.env
    permissions: '0600'
    content: |
      JIT_CONFIG="{{JIT_CONFIG}}"
      GITHUB_ORG="{{GITHUB_ORG}}"
      DOCKER_MIRROR_URL="{{DOCKER_MIRROR_URL}}"
      DNS_SERVERS="{{DNS_SERVERS}}"

  # ACTIONS_RUNNER_HOOK_JOB_STARTED, set by register-runner.sh. The runcmd
  # shutdown counts from boot, so a job that lands on a long-idle runner would
  # get only what is left of it. Restart the 6 hours from the job's start.
  # The runner runs this with bash -e, and a failing hook fails the job.
  - path: /opt/runner-job-started.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      sudo -n shutdown -c || true
      sudo -n shutdown -h +360 "Safety timeout: max job runtime reached" || true

  - path: /opt/register-runner.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      # Logging with timestamps
      log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"; }
      log_error() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: $1" >&2; }
      log_warn() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] WARNING: $1" >&2; }

      # Always shut down the VM when this script exits (success or failure).
      # Prevents zombie VMs that block a runner slot forever.
      # EXIT fires on any exit — ERR does NOT fire for handled errors (|| blocks).
      trap 'log "Shutting down VM..."; shutdown -h now' EXIT

      log "=== GitHub Actions Runner (JIT) ==="

      # Validate environment
      if [[ ! -f /etc/github-runner/config.env ]]; then
        log_error "Config file not found: /etc/github-runner/config.env"
        exit 1
      fi

      source /etc/github-runner/config.env

      # The JIT config is minted on the Proxmox host and injected via cloud-init;
      # the org PAT never enters this VM. Labels and the runner name are baked
      # into the config, so no config.sh registration step is needed.
      : ${JIT_CONFIG:?JIT_CONFIG not set}

      # Configure Docker mirror if set. Supabase pulls reach the mirror through
      # the image registry override passed to run.sh. Docker's containerd image
      # store (HTTPS mirrors) reads per-registry hosts.toml from
      # /etc/docker/certs.d, never /etc/containerd/certs.d; that routes
      # public.ecr.aws through the mirror. HTTP mirrors use overlay2, which
      # reads no hosts.toml. A failed Docker restart refuses to register.
      # Docker verifies an HTTPS mirror's certificate against the system
      # roots. Only a mirror addressed by IP literal (IPv4, or IPv6 in
      # brackets), which usually has a self-signed or internal certificate,
      # skips that check. The bake applies the same rule. A mirror addressed
      # by name (MIRROR_NAME) must also resolve with DNS_SERVERS (below).
      MIRROR_REGISTRY=""
      MIRROR_NAME=""
      if [[ -n "${DOCKER_MIRROR_URL:-}" ]]; then
        log "Configuring Docker mirror for public.ecr.aws: $DOCKER_MIRROR_URL"
        mkdir -p /etc/docker/certs.d/public.ecr.aws
        SUPABASE_IMAGE_REGISTRY="${DOCKER_MIRROR_URL#http://}"
        SUPABASE_IMAGE_REGISTRY="${SUPABASE_IMAGE_REGISTRY#https://}"
        MIRROR_REGISTRY="${SUPABASE_IMAGE_REGISTRY%%/*}"
        mkdir -p "/etc/docker/certs.d/$MIRROR_REGISTRY"
        MIRROR_TLS=""
        if [[ "$MIRROR_REGISTRY" == \[* || "${MIRROR_REGISTRY%%:*}" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
          [[ "$DOCKER_MIRROR_URL" != https://* ]] || MIRROR_TLS=$'\n  skip_verify = true'
        else
          MIRROR_NAME="${MIRROR_REGISTRY%%:*}"
        fi
        if [[ "$DOCKER_MIRROR_URL" == http://* ]]; then
          cat > /etc/docker/daemon.json <<DOCKEREOF
      {
        "storage-driver": "overlay2",
        "insecure-registries": ["$MIRROR_REGISTRY"]
      }
      DOCKEREOF
        else
          cat > /etc/docker/daemon.json <<'DOCKEREOF'
      {
        "features": {
          "containerd-snapshotter": true
        }
      }
      DOCKEREOF
        fi
        cat > /etc/docker/certs.d/public.ecr.aws/hosts.toml <<TOMLEOF
      server = "https://public.ecr.aws"

      [host."$DOCKER_MIRROR_URL"]
        capabilities = ["pull", "resolve"]$MIRROR_TLS
      TOMLEOF
        cat > "/etc/docker/certs.d/$MIRROR_REGISTRY/hosts.toml" <<TOMLEOF
      server = "$DOCKER_MIRROR_URL"

      [host."$DOCKER_MIRROR_URL"]
        capabilities = ["pull", "resolve"]$MIRROR_TLS
      TOMLEOF
        if systemctl restart docker; then
          log "Docker mirror configured"
          log "Supabase image registry override: $SUPABASE_IMAGE_REGISTRY"
        else
          log_error "Docker restart failed after mirror config; refusing to register runner"
          exit 1
        fi
      fi
      # The template keeps the hosts.toml files of the mirror it was baked
      # with, and Docker reads them on every pull. Remove those the configured
      # mirror does not use, or a mirror removed or replaced since the bake
      # stays in the path of public.ecr.aws pulls until the next rebake.
      for HOSTS_TOML in /etc/docker/certs.d/*/hosts.toml; do
        [[ -e "$HOSTS_TOML" ]] || continue
        HOSTS_DIR="${HOSTS_TOML%/hosts.toml}"
        HOSTS_DIR="${HOSTS_DIR##*/}"
        if [[ -n "$MIRROR_REGISTRY" && ( "$HOSTS_DIR" == public.ecr.aws || "$HOSTS_DIR" == "$MIRROR_REGISTRY" ) ]]; then
          continue
        fi
        rm -f "$HOSTS_TOML"
        log "Removed the template's stale Docker mirror config: $HOSTS_TOML"
      done

      if ! systemctl is-active --quiet docker; then
        log_error "Docker is not running; refusing to register runner"
        exit 1
      fi

      RUNNER_HOME=/home/runner/actions-runner
      RUNNER_USER=runner

      # Verify runner binary exists (should be baked into template)
      if [[ ! -f "$RUNNER_HOME/run.sh" ]]; then
        log_error "Runner binary not found at $RUNNER_HOME/run.sh"
        log_error "The VM template may not have been baked correctly. Re-run 'runner setup'."
        exit 1
      fi

      cd $RUNNER_HOME

      # Proxmox's --nameserver never reaches eth0: cloud-init attaches global
      # nameservers only to statically addressed interfaces, and eth0 is DHCP.
      # Apply DNS_SERVERS here, and keep them only if they resolve github.com
      # and the mirror's name: a network that blocks public DNS, or a mirror
      # with a LAN name, would otherwise break every clone. Without them, or
      # when they fail, use the DHCP servers, read before DNS_SERVERS replace
      # them, and drop the gateway (often not a resolver for VMs on bridged
      # networks) unless it is the only server.
      # Each lookup can find nothing, which must not end the script.
      CONFIGURED_DNS=$(resolvectl status eth0 2>/dev/null | grep "DNS Servers:" | sed 's/.*DNS Servers: //' || true)
      DNS_CHECK_NAMES=(github.com)
      [[ -z "$MIRROR_NAME" ]] || DNS_CHECK_NAMES+=("$MIRROR_NAME")
      DNS_UNRESOLVED=""
      # 0 when every name in $@ resolves through eth0's servers. Otherwise the
      # first that does not is in DNS_UNRESOLVED. resolved retries a lost
      # query for up to two minutes, so each try is cut short.
      resolves_on_eth0() {
        local name attempt
        for name in "$@"; do
          for attempt in 1 2 3; do
            if timeout 10 resolvectl query --interface=eth0 --cache=no "$name" > /dev/null 2>&1; then
              continue 2
            fi
            [[ $attempt -eq 3 ]] || sleep 2
          done
          DNS_UNRESOLVED=$name
          return 1
        done
      }
      DNS_KEPT=0
      if [[ -n "${DNS_SERVERS:-}" ]]; then
        if ! resolvectl dns eth0 $DNS_SERVERS; then
          log_error "Failed to set DNS servers: $DNS_SERVERS"
        elif resolves_on_eth0 "${DNS_CHECK_NAMES[@]}"; then
          log "DNS servers: $DNS_SERVERS"
          DNS_KEPT=1
        else
          log_warn "DNS servers $DNS_SERVERS cannot resolve $DNS_UNRESOLVED; using the DHCP servers instead. Set DNS_SERVERS in /etc/github-runners.conf on the Proxmox host to resolvers that answer on this network, or leave it empty to use DHCP."
          resolvectl revert eth0 || log_error "Failed to revert eth0 to the DHCP DNS servers"
        fi
      fi
      if [[ "$DNS_KEPT" == 0 ]]; then
        GATEWAY=$(ip route | awk '/default/{print $3}' || true)
        CLEAN_DNS=$(echo "$CONFIGURED_DNS" | tr ' ' '\n' | grep -vxF "$GATEWAY" | tr '\n' ' ' || true)
        if [[ -n "$CLEAN_DNS" ]]; then
          resolvectl dns eth0 $CLEAN_DNS 2>/dev/null || true
          log "DNS servers: ${CLEAN_DNS% } (DHCP, gateway removed)"
        else
          log "DNS servers: ${CONFIGURED_DNS:-none} (DHCP, unchanged)"
        fi
      fi

      # Wait for network connectivity
      log "[1/2] Checking network connectivity..."
      for i in {1..30}; do
        if curl -sf --max-time 5 https://github.com > /dev/null 2>&1; then
          log "Network connectivity confirmed"
          break
        fi
        if [[ $i -eq 30 ]]; then
          log_error "No network connectivity after 30 attempts"
          exit 1
        fi
        log "Waiting for network... ($i/30)"
        sleep 2
      done

      # Capture the JIT config, then remove the at-rest filesystem copies before
      # the job runs (the runner user has NOPASSWD sudo). NOTE: the config still
      # lives on the attached cloud-init drive (/dev/sr0) and is on run.sh's
      # command line while the runner is up, both readable in-guest — but it is
      # SINGLE-USE, so a job that recovers it cannot register another runner.
      JIT="$JIT_CONFIG"
      rm -f /etc/github-runner/config.env
      rm -f /var/lib/cloud/instance/user-data.txt* /var/lib/cloud/instances/*/user-data.txt* 2>/dev/null || true

      # run.sh --disableupdate does not set the disableUpdate bit the session sends.
      patch_jit_disableupdate() {
        local decoded patched
        decoded=$(printf '%s' "$1" | base64 -d) || return 1
        jq -e 'keys[] | select(endswith(".runner"))' <<<"$decoded" >/dev/null || return 1
        patched=$(jq -c '
          with_entries(
            if (.key | endswith(".runner")) then
              .value = (.value | @base64d | fromjson | .disableUpdate = true | tojson | @base64)
            else
              .
            end
          )' <<<"$decoded") || return 1
        printf '%s' "$patched" | base64 -w0
      }
      # Templates baked since the daily rebake record /opt/.baked-runner-version,
      # and the rebake keeps them current. An older template has no record and
      # may hold a runner GitHub refuses unless it updates, so its clones keep
      # updating themselves until a rebake replaces it.
      if [[ -f /opt/.baked-runner-version ]]; then
        if ! JIT=$(patch_jit_disableupdate "$JIT"); then
          log_error "Failed to set disableUpdate on the JIT runner config"
          exit 1
        fi
      else
        log "No /opt/.baked-runner-version: template predates the rebake, leaving runner self-update on"
      fi

      # Signal that the runner is ready
      touch /opt/.runner-ready

      log "[2/2] Starting JIT runner (ephemeral — shuts down after one job)..."
      log "Runner name: $(hostname)"
      log "Organization: ${GITHUB_ORG:-unknown}"

      # Run directly with the JIT config (no config.sh registration needed; JIT
      # runners are inherently ephemeral and auto-remove). When run.sh exits
      # (job complete or error), the VM shuts down and the hookscript reclones;
      # after a refused runner version it first stays up a few minutes.
      # sudo resets the environment, so run.sh's settings go through env. With
      # ACTIONS_RUNNER_RETURN_VERSION_DEPRECATED_EXIT_CODE=1 (runner 2.333.0+),
      # a runner version GitHub refuses exits 7 instead of looking like success.
      # The job-started hook restarts the safety shutdown when a job starts.
      RUNNER_ENV=(
        ACTIONS_RUNNER_RETURN_VERSION_DEPRECATED_EXIT_CODE=1
        ACTIONS_RUNNER_HOOK_JOB_STARTED=/opt/runner-job-started.sh
      )
      # How long a VM whose runner version GitHub refused stays up (below).
      VERSION_REFUSED_HOLD_SECS=300
      RUN_STATUS=0
      if [[ -n "${SUPABASE_IMAGE_REGISTRY:-}" ]]; then
        sudo -u $RUNNER_USER env "${RUNNER_ENV[@]}" SUPABASE_INTERNAL_IMAGE_REGISTRY="$SUPABASE_IMAGE_REGISTRY" INTERNAL_IMAGE_REGISTRY="$SUPABASE_IMAGE_REGISTRY" ./run.sh --jitconfig "$JIT" --disableupdate || RUN_STATUS=$?
      else
        sudo -u $RUNNER_USER env "${RUNNER_ENV[@]}" ./run.sh --jitconfig "$JIT" --disableupdate || RUN_STATUS=$?
      fi
      case "$RUN_STATUS" in
        0) log "run.sh exited 0" ;;
        7)
          log_error "run.sh exited 7: GitHub refused this runner version. Run 'runner rebake' on the Proxmox host."
          # The host sees only a stopped VM and clones the slot again from the
          # same template, whose runner is refused a minute or so after boot.
          # Leave the reason where `qm guest exec` can read it, and stay up a
          # few minutes, so a refused slot cannot cycle every minute.
          printf 'rc=7\nrunner_version=%s\n' "$(cat /opt/.baked-runner-version 2>/dev/null || echo unknown)" \
            > /opt/.runner-version-refused || log_error "Could not write /opt/.runner-version-refused"
          log "Holding the VM for ${VERSION_REFUSED_HOLD_SECS}s before it powers off. From the Proxmox host: qm guest exec <vmid> -- cat /opt/.runner-version-refused"
          sleep "$VERSION_REFUSED_HOLD_SECS"
          ;;
        *) log_error "run.sh exited $RUN_STATUS" ;;
      esac
      # EXIT trap handles shutdown

runcmd:
  # Hard ceiling: shut down after 6 hours even if run.sh hangs. This counts
  # from boot; /opt/runner-job-started.sh restarts it when a job starts.
  # Single-quoted so YAML doesn't parse the colon in "Safety timeout:" as a mapping.
  - 'shutdown -h +360 "Safety timeout: max VM lifetime reached" &'
  - /opt/register-runner.sh 2>&1 | tee /var/log/runner-setup.log
